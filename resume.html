<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>KoreanCV.com - AI English to Korean Resume Converter</title>
        <meta name="description" content="Convert English resumes into standard Korean Iryeokseo format instantly with AI.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- custom css -->
        <link rel="stylesheet" href="assets/css/main.css">
        <!-- PDF.js CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script>
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        </script>
        <!-- Lemon Squeezy Overlay Script -->
        <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
        <style>
            .korean-resume-container {
                max-width: 850px;
                margin: 0 auto;
                background: #fff;
                padding: 20px;
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
                color: #000;
                position: relative;
            }
            .korean-resume-table {
                width: 100%;
                border-collapse: collapse;
                border: 2px solid #000;
                font-size: 14px;
            }
            .korean-resume-table th, .korean-resume-table td {
                border: 1px solid #000;
                padding: 8px 10px;
                vertical-align: middle;
                text-align: center;
            }
            .kr-title-cell h2 {
                font-size: 26px;
                letter-spacing: 20px;
                margin: 0;
                font-weight: bold;
            }
            .kr-photo-cell {
                width: 140px;
                height: 170px;
                text-align: center;
                padding: 5px;
            }
            .preview-image, .preview-image img {
                border-radius: 0 !important;
            }
            .preview-image img {
                width: 125px;
                height: 155px;
                object-fit: cover;
                display: block;
                margin: 0 auto;
            }
            .kr-photo-label {
                font-size: 11px;
                color: #555;
                margin-top: 2px;
            }
            .kr-th, .kr-sub-th, .kr-section-header {
                background-color: #f8f9fa;
                font-weight: bold;
            }
            .kr-section-header {
                font-size: 15px;
                letter-spacing: 6px;
                background-color: #f1f3f5;
            }
            .kr-td {
                text-align: left;
            }
            .kr-table-content-cell {
                padding: 0;
                text-align: left;
            }
            .preview-blk-list {
                min-height: 35px;
                padding: 5px;
            }
            /* AI Dropzone Styling */
            .ai-dropzone {
                border: 2px dashed #28a745;
                padding: 30px;
                text-align: center;
                background: #f8fff9;
                border-radius: 8px;
                margin-bottom: 25px;
                cursor: pointer;
            }
            .ai-dropzone.dragover {
                background: #e2fbe5;
            }
            /* Watermark Overlay */
            .watermark-overlay {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;
                z-index: 10;
                opacity: 0.15;
                font-size: 64px;
                font-weight: bold;
                color: red;
                transform: rotate(-30deg);
                user-select: none;
            }
            .unlocked .watermark-overlay {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <nav class = "navbar bg-white">
            <div class="container">
                <div class = "navbar-content">
                    <div class = "brand-and-toggler">
                        <a href = "index.html" class = "navbar-brand">
                            <img src = "assets/images/curriculum-vitae.png" alt = "" class = "navbar-brand-icon">
                            <span class = "navbar-brand-text">korean<span>cv.</span></span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <section id = "about-sc" class = "">
            <div class = "container">
                <div class = "about-cnt">
                    <!-- AI Dropzone Feature -->
                    <div class="ai-dropzone" id="dropzone" onclick="document.getElementById('resume-file-input').click()">
                        <h3>🤖 Drop your English Resume (PDF) here</h3>
                        <p>AI will instantly translate and format it into a Korean Iryeokseo template.</p>
                        <input type="file" id="resume-file-input" accept="application/pdf" style="display:none" onchange="handleFileSelect(event)">
                        <div id="ai-status" style="margin-top: 10px; font-weight: bold; color: #28a745;"></div>
                    </div>

                    <form action="" class="cv-form" id = "cv-form">
                        <div class = "cv-form-blk">
                            <div class = "cv-form-row-title">
                                <h3>about section</h3>
                            </div>
                            <div class = "cv-form-row cv-form-row-about">
                                <div class = "cols-3">
                                    <div class = "form-elem">
                                        <label class = "form-label">First Name</label>
                                        <input name = "firstname" type = "text" class = "form-control firstname" onkeyup="generateCV()" placeholder="e.g. John">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Middle Name <span class = "opt-text">(optional)</span></label>
                                        <input name = "middlename" type = "text" class = "form-control middlename" onkeyup="generateCV()" placeholder="e.g. Herbert">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Last Name</label>
                                        <input name = "lastname" type = "text" class = "form-control lastname" onkeyup="generateCV()" placeholder="e.g. Doe">
                                    </div>
                                </div>

                                <div class="cols-3">
                                    <div class = "form-elem">
                                        <label class = "form-label">Your Image</label>
                                        <input name = "image" type = "file" class = "form-control image" accept = "image/*" onchange="previewImage()">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Designation / Nationality</label>
                                        <input name = "designation" type = "text" class = "form-control designation" onkeyup="generateCV()" placeholder="e.g. Australian">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Address</label>
                                        <input name = "address" type = "text" class = "form-control address" onkeyup="generateCV()" placeholder="e.g. Seoul, Jongno-gu">
                                    </div>
                                </div>

                                <div class = "cols-3">
                                    <div class = "form-elem">
                                        <label class = "form-label">Email</label>
                                        <input name = "email" type = "text" class = "form-control email" onkeyup="generateCV()" placeholder="e.g. email@naver.com">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Phone No</label>
                                        <input name = "phoneno" type = "text" class = "form-control phoneno" onkeyup="generateCV()" placeholder="e.g. 010-0000-0000">
                                    </div>
                                    <div class = "form-elem">
                                        <label class = "form-label">Summary / DOB</label>
                                        <input name = "summary" type = "text" class = "form-control summary" onkeyup="generateCV()" placeholder="e.g. 1985년 2월 15일생">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Repeaters for Experience, Education, Achievements -->
                        <div class="cv-form-blk">
                            <div class = "cv-form-row-title"><h3>experience</h3></div>
                            <div class = "row-separator repeater">
                                <div class = "repeater" data-repeater-list = "group-b">
                                    <div data-repeater-item>
                                        <div class = "cv-form-row cv-form-row-experience">
                                            <div class = "cols-3">
                                                <div class = "form-elem"><label class = "form-label">Title</label><input name = "exp_title" type = "text" class = "form-control exp_title" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">Company</label><input name = "exp_organization" type = "text" class = "form-control exp_organization" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">Location</label><input name = "exp_location" type = "text" class = "form-control exp_location" onkeyup="generateCV()"></div>
                                            </div>
                                            <div class = "cols-3">
                                                <div class = "form-elem"><label class = "form-label">Start Date</label><input name = "exp_start_date" type = "date" class = "form-control exp_start_date" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">End Date</label><input name = "exp_end_date" type = "date" class = "form-control exp_end_date" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">Description</label><input name = "exp_description" type = "text" class = "form-control exp_description" onkeyup="generateCV()"></div>
                                            </div>
                                            <button data-repeater-delete type = "button" class = "repeater-remove-btn">-</button>
                                        </div>
                                    </div>
                                </div>
                                <button type = "button" data-repeater-create value = "Add" class = "repeater-add-btn">+</button>
                            </div>
                        </div>

                        <div class="cv-form-blk">
                            <div class = "cv-form-row-title"><h3>education</h3></div>
                            <div class = "row-separator repeater">
                                <div class = "repeater" data-repeater-list = "group-c">
                                    <div data-repeater-item>
                                        <div class = "cv-form-row cv-form-row-experience">
                                            <div class = "cols-3">
                                                <div class = "form-elem"><label class = "form-label">School</label><input name = "edu_school" type = "text" class = "form-control edu_school" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">Degree</label><input name = "edu_degree" type = "text" class = "form-control edu_degree" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">City</label><input name = "edu_city" type = "text" class = "form-control edu_city" onkeyup="generateCV()"></div>
                                            </div>
                                            <div class = "cols-3">
                                                <div class = "form-elem"><label class = "form-label">Start Date</label><input name = "edu_start_date" type = "date" class = "form-control edu_start_date" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">End Date</label><input name = "edu_graduation_date" type = "date" class = "form-control edu_graduation_date" onkeyup="generateCV()"></div>
                                                <div class = "form-elem"><label class = "form-label">Description</label><input name = "edu_description" type = "text" class = "form-control edu_description" onkeyup="generateCV()"></div>
                                            </div>
                                            <button data-repeater-delete type = "button" class = "repeater-remove-btn">-</button>
                                        </div>
                                    </div>
                                </div>
                                <button type = "button" data-repeater-create value = "Add" class = "repeater-add-btn">+</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Preview Section with Watermark -->
        <section id = "preview-sc" class = "print_area">
            <div class = "container">
                <div class = "preview-cnt korean-resume-container" id = "resume-preview-box">
                    <div class="watermark-overlay">PREVIEW WATERMARK</div>
                    <table class = "korean-resume-table">
                        <tr>
                            <td rowspan = "3" class = "kr-photo-cell">
                                <div class = "preview-image">
                                    <img src = "" alt = "Photo" id = "image_dsp"> 
                                </div>
                                <div class = "kr-photo-label">사 진</div>
                            </td>
                            <td colspan = "4" class = "kr-title-cell">
                                <h2>이 력 서</h2>
                            </td>
                        </tr>
                        <tr>
                            <th class = "kr-th" style="width: 12%;">성 명</th>
                            <td colspan = "2" class = "kr-td" style="width: 38%;"><span id = "fullname_dsp"></span></td>
                            <th class = "kr-th" style="width: 12%;">국 적</th>
                            <td class = "kr-td" style="width: 26%;"><span id = "designation_dsp"></span></td>
                        </tr>
                        <tr>
                            <th class = "kr-th">생년월일</th>
                            <td colspan = "4" class = "kr-td"><span id = "summary_dsp"></span></td>
                        </tr>
                        <tr>
                            <th class = "kr-th">주 소</th>
                            <td colspan = "5" class = "kr-td"><span id = "address_dsp"></span></td>
                        </tr>
                        <tr>
                            <th rowspan = "2" class = "kr-th">연 락 처</th>
                            <th class = "kr-sub-th">전 화</th>
                            <td colspan = "2" class = "kr-td"><span id = "phoneno_dsp"></span></td>
                            <th class = "kr-sub-th">전자우편</th>
                            <td class = "kr-td"><span id = "email_dsp"></span></td>
                        </tr>
                        <tr>
                            <th class = "kr-sub-th">핸드폰</th>
                            <td colspan = "4" class = "kr-td"><span id = "phoneno_dsp"></span></td>
                        </tr>
                        <tr>
                            <th colspan = "2" class = "kr-section-header">기 간</th>
                            <th colspan = "3" class = "kr-section-header">학 력</th>
                            <th class = "kr-section-header">발 령 청</th>
                        </tr>
                        <tr>
                            <td colspan = "6" class = "kr-table-content-cell">
                                <div class = "educations-items preview-blk-list" id = "educations_dsp"></div>
                            </td>
                        </tr>
                        <tr>
                            <th colspan = "2" class = "kr-section-header">기 간</th>
                            <th colspan = "3" class = "kr-section-header">경 력 사 항</th>
                            <th class = "kr-section-header">발 령 청</th>
                        </tr>
                        <tr>
                            <td colspan = "6" class = "kr-table-content-cell">
                                <div class = "experiences-items preview-blk-list" id = "experiences_dsp"></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </section>

        <!-- Payment & Print Controller -->
        <section class = "print-btn-sc">
            <div class = "container">
                <button type = "button" class = "print-btn btn btn-primary" id="unlock-print-btn" onclick="handlePrintOrCheckout()">Unlock & Print PDF ($7.99)</button>
            </div>
        </section>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.4.js" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.repeater/1.2.1/jquery.repeater.js" crossorigin="anonymous"></script>
        <script src = "assets/js/script.js"></script>
        <script src="assets/js/app.js"></script>

        <script>
            let isPaid = false;

            // 1. Client-Side PDF Extraction using PDF.js
            async function handleFileSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                const statusEl = document.getElementById('ai-status');
                statusEl.innerText = "Extracting text from PDF...";

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                    }

                    statusEl.innerText = "Sending to AI translator (gpt-4o-mini)...";
                    
                    // Call Cloudflare Pages Function endpoint
                    const response = await fetch('/api/convert', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: fullText })
                    });

                    if (!response.ok) throw new Error("AI conversion failed");

                    const data = await response.json();
                    populateFormFields(data);
                    statusEl.innerText = "Success! Resume populated & translated.";
                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "Error parsing file. Please fill out manually.";
                }
            }

            // 2. Auto-Populate Form Handler
            function populateFormFields(data) {
                if (data.firstname) $('input.firstname').val(data.firstname);
                if (data.lastname) $('input.lastname').val(data.lastname);
                if (data.designation) $('input.designation').val(data.designation);
                if (data.address) $('input.address').val(data.address);
                if (data.email) $('input.email').val(data.email);
                if (data.phoneno) $('input.phoneno').val(data.phoneno);
                if (data.summary) $('input.summary').val(data.summary);
                
                // Trigger live preview update
                if (typeof generateCV === 'function') generateCV();
            }

            // 3. Lemon Squeezy Payment & Unlock Hook
            function handlePrintOrCheckout() {
                if (isPaid) {
                    window.print();
                } else {
                    // Trigger Lemon Squeezy Checkout Modal
                    // Replace with your actual Lemon Squeezy checkout variant URL
                    LemonSqueezy.Url.Open('https://koreancv.lemonsqueezy.com/checkout/buy/YOUR_VARIANT_ID');
                }
            }

            // Lemon Squeezy Event Listener for Success
            window.addEventListener('lemon-squeezy-success', function (event) {
                isPaid = true;
                const previewBox = document.getElementById('resume-preview-box');
                previewBox.classList.add('unlocked');
                document.getElementById('unlock-print-btn').innerText = "Print Clean PDF";
                window.print();
            });
        </script>
    </body>
</html>
